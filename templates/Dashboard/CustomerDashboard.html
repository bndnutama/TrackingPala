{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title|default:"Aplikasi Dashboard" }}</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    
    <style>
        /* Variabel Warna */
        :root {
            --sidebar-width: 280px;
            --collapsed-sidebar-width: 70px; 
            --sidebar-bg: #58310a; 
            --sidebar-text: #e8eaed; 
            --sidebar-icon: #9aa0a6; 
            --hover-bg-dark: #303134; 
            --border-color-dark: #666651; 

            --primary-color: #a37f5d; 
            --primary-hover: #8c6a4e; 
            --dark-color: #755646; 
            --light-bg: #f7f3ed; 
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--light-bg);
            color: var(--dark-color);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
        }
        
        /* --- STYLING SIDEBAR (DARK MODE) --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg); 
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.3);
            position: fixed;
            height: 100%;
            top: 0;
            left: 0;
            padding: 10px 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            transition: width 0.3s ease, transform 0.3s ease; 
            flex-shrink: 0;
            width: var(--collapsed-sidebar-width); 
            transform: translateX(0); 
        }

        .sidebar.expanded {
            width: var(--sidebar-width);
        }
        
        .sidebar:not(.expanded) .sidebar-brand-text,
        .sidebar:not(.expanded) .nav-button-text {
            display: none;
        }
        .sidebar.expanded .sidebar-brand-text,
        .sidebar.expanded .nav-button-text {
            display: inline-block;
        }

        .sidebar-top {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            margin-bottom: 20px;
        }
        .sidebar-top .toggle-btn { 
            background: none;
            border: none;
            color: var(--sidebar-text); 
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background-color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 0;
            flex-shrink: 0;
        }
        .sidebar-top .toggle-btn:hover {
            background-color: var(--hover-bg-dark); 
        }
        .sidebar.expanded .sidebar-top .toggle-btn {
            margin-right: 10px;
        }

        .sidebar-brand-text {
            font-weight: 600;
            color: var(--sidebar-text); 
            text-decoration: none;
            white-space: nowrap;
        }

        .nav-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 0 10px;
        }
        .nav-button {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            font-weight: 500;
            color: var(--sidebar-text); 
            text-decoration: none;
            border-radius: 20px;
            transition: background-color 0.2s ease;
            box-sizing: border-box;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .nav-button:hover {
            background-color: var(--hover-bg-dark); 
        }
        .nav-button .material-symbols-outlined {
            font-size: 24px;
            margin-right: 15px;
            color: var(--sidebar-icon); 
            flex-shrink: 0;
        }
        .new-chat-btn {
            border: 1px solid var(--border-color-dark); 
            margin-bottom: 15px;
            margin-top: 5px;
        }
        .sidebar-bottom {
            margin-top: auto;
            padding: 10px 10px;
            border-top: 1px solid var(--border-color-dark); 
        }
        .settings-btn, .logout-link {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            font-weight: 500;
            color: var(--sidebar-text); 
            text-decoration: none;
            border-radius: 20px;
            transition: background-color 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .settings-btn:hover, .logout-link:hover {
            background-color: var(--hover-bg-dark); 
        }
        .settings-btn .material-symbols-outlined,
        .logout-link .material-symbols-outlined {
            font-size: 24px;
            margin-right: 15px;
            color: var(--sidebar-icon); 
            flex-shrink: 0;
        }

        /* --- KONTEN UTAMA (Coklat/Krem - Shifting) --- */
        .main-content {
            flex-grow: 1;
            margin-left: var(--collapsed-sidebar-width); 
            padding: 40px;
            box-sizing: border-box;
            transition: margin-left 0.3s ease;
            overflow-y: auto;
        }
        
        .main-content.pushed {
            margin-left: var(--sidebar-width);
        }

        .content-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--primary-color); 
        }
        
        .toggle-btn-main { 
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s;
        }
        .toggle-btn-main:hover {
            background-color: var(--primary-hover);
        }

        /* 🟢 START: CARD STYLES */
        .content {
            /* 🟢 Menggunakan Grid untuk layout card yang bersebelahan */
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); /* Responsif */
            gap: 25px;
            margin-top: 20px;
        }
        .card {
            background-color: #ffffff;
            border-radius: 12px;
            /* Box Shadow halus, menggunakan warna coklat */
            box-shadow: 0 4px 15px rgba(117, 86, 70, 0.1); 
            transition: transform 0.2s ease;
            overflow: hidden;
            border: 1px solid #f0e6da; /* Garis tipis */
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(117, 86, 70, 0.2); 
        }
        .card-body {
            padding: 25px;
            text-align: left;
        }
        .card-title {
            color: var(--primary-color);
            font-weight: 600;
            font-size: 1em;
            margin-top: 0;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .card-body h1 {
            color: var(--dark-color);
            font-size: 2.5em;
            margin: 0;
            font-weight: 700;
        }
        /* 🟢 END: CARD STYLES */


        /* --- OVERLAY (Mobile) --- */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 999;
            display: none;
        }
        .overlay.active {
            display: block;
        }

        /* ================================================== */
        /* MEDIA QUERY: Perilaku Mobile (Overlay) */
        /* ================================================== */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(calc(-1 * var(--sidebar-width))); 
                box-shadow: 4px 0 10px rgba(0, 0, 0, 0.4);
                width: var(--sidebar-width);
            }
            .sidebar.active {
                transform: translateX(0);
            }
            .sidebar.expanded { 
                width: var(--sidebar-width);
            }
            .main-content {
                margin-left: 0;
                padding-left: 20px;
                padding-right: 20px;
            }
            .main-content.pushed {
                margin-left: 0;
            }
            .content-header {
                padding-top: 10px;
            }
        }
    </style>
</head>
<body>
    
    <div class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <button class="toggle-btn" onclick="toggleSidebar()">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <span class="sidebar-brand-text">{{ title}}</span>
        </div>
        
        <div class="nav-container">
            <a href="{% url 'scanpage' user.Role %}" class="nav-button">
                <span class="material-symbols-outlined">barcode_scanner</span>
                <span class="nav-button-text">Scan Produk</span>
            </a>
            <a href="Produk/" class="nav-button">
                <span class="material-symbols-outlined">list_alt</span>
                <span class="nav-button-text">List Product</span>
            </a>
        </div>


        <div class="sidebar-bottom">
            <a href="Profil/" class="settings-btn">
                <span class="material-symbols-outlined">person</span>
                <span class="nav-button-text">Profile</span> 
            </a>
            <a href="{% url 'logout' %}" class="logout-link">
                <span class="material-symbols-outlined">logout</span>
                <span class="nav-button-text">Logout</span>
            </a>
        </div>
    </div>

    <div class="main-content" id="main-content">
        <div class="content-header">
            <button class="toggle-btn-main" onclick="toggleSidebar()">☰ Menu</button>
            <h1 style="margin: 0;">Dashboard Konsumen</h1>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('main-content');
            const overlay = document.getElementById('overlay');
            
            if (window.innerWidth > 768) {
                const isExpanded = sidebar.classList.contains('expanded');

                if (isExpanded) {
                    sidebar.classList.remove('expanded');
                    mainContent.classList.remove('pushed');
                } else {
                    sidebar.classList.add('expanded');
                    mainContent.classList.add('pushed');
                }
            } 
            else {
                sidebar.classList.toggle('active');
                overlay.classList.toggle('active');
                document.body.style.overflow = sidebar.classList.contains('active') ? 'hidden' : 'auto';
            }
        }

        function adjustLayout() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('main-content');
            const overlay = document.getElementById('overlay');
            
            if (window.innerWidth > 768) {
                if (!sidebar.classList.contains('expanded')) {
                    mainContent.style.marginLeft = 'var(--collapsed-sidebar-width)';
                } else {
                    mainContent.style.marginLeft = 'var(--sidebar-width)';
                }
                sidebar.classList.remove('active');
                overlay.classList.remove('active');
                document.body.style.overflow = 'auto';
            } else {
                sidebar.classList.remove('active');
                sidebar.classList.remove('expanded');
                mainContent.style.marginLeft = '0';
                overlay.classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        }

        window.onload = adjustLayout;
        window.onresize = adjustLayout;

        window.addEventListener('DOMContentLoaded', () => {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('main-content');
            if (window.innerWidth > 768) {
                sidebar.classList.remove('expanded');
                mainContent.classList.remove('pushed');
                mainContent.style.marginLeft = 'var(--collapsed-sidebar-width)';
            }
        });
    </script>
</body>
</html>
