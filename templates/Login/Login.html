{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Akun - {{ title }}</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* Global Reset dan Font */
        body {
            /* Menggunakan Montserrat */
            font-family: 'Montserrat', sans-serif;
            background-color: #f7f3ed; /* Krem muda/Off-white */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px; /* Padding untuk responsif di layar kecil */
            box-sizing: border-box;
        }
        .login-card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 15px;
            /* Bayangan halus, sedikit coklat */
            box-shadow: 0 10px 30px rgba(117, 86, 70, 0.1); 
            width: 100%;
            max-width: 400px; /* Ukuran yang sedikit lebih besar */
            text-align: center;
            box-sizing: border-box;
        }
        h2 {
            color: #755646; /* Coklat Tua */
            margin-bottom: 25px;
            font-size: 1.8em;
            font-weight: 700;
            /* Menghapus emoji default */
        }
        label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            color: #5d4037; /* Coklat sedang untuk label */
            font-weight: 600;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #c2b4a5; /* Garis tepi coklat muda */
            border-radius: 8px;
            box-sizing: border-box;
            transition: border-color 0.3s;
            font-family: 'Montserrat', sans-serif;
            font-size: 1em;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #b8860b; /* Emas/Kuning Kunyit saat fokus */
            outline: none;
            box-shadow: 0 0 5px rgba(184, 134, 11, 0.5);
        }
        .login-btn {
            width: 100%;
            padding: 15px;
            background-color: #a37f5d; /* Coklat Medium/Tan (Warna Primer) */
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s, box-shadow 0.3s;
            font-weight: 700;
            margin-top: 10px;
        }
        .login-btn:hover {
            background-color: #8c6a4e; /* Coklat lebih tua saat hover */
            box-shadow: 0 6px 15px rgba(163, 127, 93, 0.4);
        }
        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px; 
                margin: 20px;   
                border-radius: 10px;
            }
            h2 {
                font-size: 1.6em; 
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Masuk ke Akun Anda</h2>
        <form method="POST">
            {% csrf_token %}
            
            <label for="username">Nama Pengguna:</label>
            <input type="text" name="username" id="username" placeholder="Masukkan nama pengguna" required>
            
            <label for="password">Password:</label>
            <input type="password" name="password" id="password" placeholder="Masukkan kata sandi" required>
            
            <button type="submit" class="login-btn">Login</button>
        </form>
        
        <p style="margin-top: 20px; font-size: 0.9em;">
            Belum punya akun? 
            <a href="{% url 'Register' %}" style="color: #755646; text-decoration: none; font-weight: 600;">Daftar di sini</a>
        </p>
    </div>
</body>
</html>
